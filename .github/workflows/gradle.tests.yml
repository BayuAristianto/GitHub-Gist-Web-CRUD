name: GitHub Gist Web Automation (Gradle)

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  Web-Selenium-Tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Generate staging.properties
        run: |
          mkdir -p src/test/resources/config
          cat << EOF > src/test/resources/config/staging.properties
          baseUrl=https://github.com
          browser=chrome
          username=${{ secrets.GIST_USERNAME }}
          password=${{ secrets.GIST_PASSWORD }}
          sessionCookie=${{ secrets.GIST_SESSION_COOKIE }}
          EOF
      

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Run Tests with Gradle
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: ./gradlew clean test --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-output/ExtentReport.html
            build/reports/tests
